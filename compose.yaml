services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: golazo
      POSTGRES_PASSWORD: golazo
      POSTGRES_DB: golazo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U golazo -d golazo']
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-bookworm
    profiles: [redis]
    ports:
      - '127.0.0.1:6379:6379'
volumes:
  postgres-data:
