name: Golazo CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: golazo
          POSTGRES_PASSWORD: golazo
          POSTGRES_DB: golazo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golazo -d golazo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://golazo:golazo@localhost:5432/golazo_test?schema=public
      TEST_DATABASE_URL: postgresql://golazo:golazo@localhost:5432/golazo_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Show standings Prettier diff
        run: |
          npx prettier --write src/modules/football/standings.ts
          git diff -- src/modules/football/standings.ts
          exit 1
      - run: npm run check
      - run: npm run commands:check
      - run: npm run smoke
      - run: npm run card:preview
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Codespaces services and setup
        run: |
          docker compose -f compose.yaml -f .devcontainer/compose.yaml run --build --rm -w /workspaces/golazo app bash .devcontainer/setup.sh
      - name: Build portable production image
        run: docker build -t golazo:test .
      - name: Stop services
        if: always()
        run: docker compose -f compose.yaml -f .devcontainer/compose.yaml down -v
